<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Cajas Responsive</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .contenedor {
            display: grid;
            gap: 15px;
        }

        /* ===== CELULAR ===== */
        .contenedor {
            grid-template-columns: 1fr;
        }

        .caja {
            height: 120px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        /* Colores celular */
        .caja:nth-child(1) {
            background: #ff4d4d;
        }

        .caja:nth-child(2) {
            background: #ff944d;
        }

        .caja:nth-child(3) {
            background: #ffd24d;
        }

        .caja:nth-child(4) {
            background: #d9ff4d;
        }

        .caja:nth-child(5) {
            background: #7dff4d;
        }

        .caja:nth-child(6) {
            background: #4dff88;
        }

        .caja:nth-child(7) {
            background: #4dffd2;
        }

        .caja:nth-child(8) {
            background: #4dd2ff;
        }

        .caja:nth-child(9) {
            background: #4d88ff;
        }

        .caja:nth-child(10) {
            background: #4d4dff;
        }

        .caja:nth-child(11) {
            background: #944dff;
        }

        .caja:nth-child(12) {
            background: #d24dff;
        }

        .caja:nth-child(13) {
            background: #ff4dd2;
        }

        .caja:nth-child(14) {
            background: #ff4d88;
        }

        .caja:nth-child(15) {
            background: #ff6666;
        }

        /* ===== TABLET ===== */
        @media(min-width:768px) {

            .contenedor {
                grid-template-columns: repeat(3, 1fr);
            }

            /* Cambian colores */
            .caja:nth-child(odd) {
                background: #1abc9c;
            }

            .caja:nth-child(even) {
                background: #ffbb00;
            }

        }

        /* ===== PC ===== */
        @media(min-width:1024px) {

            .contenedor {
                grid-template-columns: repeat(5, 1fr);
            }

            /* Nuevos colores */
            .caja {
                background: #2c3e50 !important;
                border: 4px solid #f1c40f;
            }

        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
        <div class="caja">5</div>
        <div class="caja">6</div>
        <div class="caja">7</div>
        <div class="caja">8</div>
        <div class="caja">9</div>
        <div class="caja">10</div>
        <div class="caja">11</div>
        <div class="caja">12</div>
        <div class="caja">13</div>
        <div class="caja">14</div>
        <div class="caja">15</div>

    </div>

</body>

</html>
